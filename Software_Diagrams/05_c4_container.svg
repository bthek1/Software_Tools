  <text x="892.5" y="157.5" text-anchor="middle" font-size="11.5" fill="#ffffff">Card payments</text>
  <rect x="35" y="280" width="200" height="100" rx="8" fill="#438dd5" stroke="#2e6295"/>
  <text x="135.0" y="312.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">MQTT broker</text>
  <text x="135.0" y="329.0" text-anchor="middle" font-size="11" fill="#e2e8f0">[Mosquitto]</text>
  <text x="135.0" y="344.0" text-anchor="middle" font-size="11.5" fill="#ffffff">Terminates meter TLS,</text>
  <text x="135.0" y="359.0" text-anchor="middle" font-size="11.5" fill="#ffffff">buffers messages</text>
  <rect x="330" y="280" width="200" height="100" rx="8" fill="#438dd5" stroke="#2e6295"/>
