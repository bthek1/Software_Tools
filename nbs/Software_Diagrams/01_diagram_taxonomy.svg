<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#0f172a">Software diagram types, and the three worth keeping</text>
  <rect x="20" y="52" width="184" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="112.0" y="77" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Structure</text>
  <rect x="20" y="108" width="184" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="32" y="127" font-weight="bold" fill="#0f172a">Class</text>
  <text x="32" y="144" font-size="11.5" fill="#475569">types, relationships</text>
  <rect x="20" y="166" width="184" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="32" y="185" font-weight="bold" fill="#0f172a">Component</text>
  <text x="32" y="202" font-size="11.5" fill="#475569">modules, interfaces</text>
  <rect x="20" y="224" width="184" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="32" y="243" font-weight="bold" fill="#0f172a">Deployment</text>
  <text x="32" y="260" font-size="11.5" fill="#475569">what runs where</text>
  <rect x="20" y="282" width="184" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="32" y="301" font-weight="bold" fill="#0f172a">ER</text>
  <text x="32" y="318" font-size="11.5" fill="#047857">tables, keys, FKs</text>
  <circle cx="188" cy="297" r="8" fill="#047857"/>
  <path d="M184,297 l3,3 l5,-6" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="20" y="340" width="184" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="32" y="359" font-weight="bold" fill="#0f172a">Package / dependency</text>
  <text x="32" y="376" font-size="11.5" fill="#475569">coupling, cycles</text>
  <rect x="214" y="52" width="184" height="40" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="306.0" y="77" text-anchor="middle" font-weight="bold" fill="#be185d">Behaviour</text>
  <rect x="214" y="108" width="184" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="226" y="127" font-weight="bold" fill="#0f172a">Sequence</text>
  <text x="226" y="144" font-size="11.5" fill="#047857">message order over time</text>
  <circle cx="382" cy="123" r="8" fill="#047857"/>
  <path d="M378,123 l3,3 l5,-6" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="214" y="166" width="184" height="46" rx="8" fill="#ffffff" stroke="#be185d"/>
  <text x="226" y="185" font-weight="bold" fill="#0f172a">State machine</text>
  <text x="226" y="202" font-size="11.5" fill="#475569">entity lifecycle</text>
  <rect x="214" y="224" width="184" height="46" rx="8" fill="#ffffff" stroke="#be185d"/>
  <text x="226" y="243" font-weight="bold" fill="#0f172a">Activity / flowchart</text>
  <text x="226" y="260" font-size="11.5" fill="#475569">branches, loops</text>
  <rect x="214" y="282" width="184" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="226" y="301" font-weight="bold" fill="#64748b">Communication</text>
  <text x="226" y="318" font-size="11.5" fill="#94a3b8">sequence, laid out flat</text>
  <rect x="408" y="52" width="184" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="500.0" y="77" text-anchor="middle" font-weight="bold" fill="#b45309">Requirements / scope</text>
  <rect x="408" y="108" width="184" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="420" y="127" font-weight="bold" fill="#64748b">Use case</text>
  <text x="420" y="144" font-size="11.5" fill="#94a3b8">actors, boundary</text>
  <rect x="408" y="166" width="184" height="46" rx="8" fill="#ffffff" stroke="#b45309"/>
  <text x="420" y="185" font-weight="bold" fill="#0f172a">User flow / journey</text>
  <text x="420" y="202" font-size="11.5" fill="#475569">product side, not UML</text>
  <rect x="602" y="52" width="184" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="694.0" y="77" text-anchor="middle" font-weight="bold" fill="#475569">Architecture</text>
  <rect x="602" y="108" width="184" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="614" y="127" font-weight="bold" fill="#0f172a">C4 model</text>
  <text x="614" y="144" font-size="11.5" fill="#047857">keep the container level</text>
  <circle cx="770" cy="123" r="8" fill="#047857"/>
  <path d="M766,123 l3,3 l5,-6" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="602" y="166" width="184" height="46" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="614" y="185" font-weight="bold" fill="#0f172a">Data flow (DFD)</text>
  <text x="614" y="202" font-size="11.5" fill="#475569">trust boundaries, STRIDE</text>
  <rect x="602" y="224" width="184" height="46" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="614" y="243" font-weight="bold" fill="#0f172a">Network topology</text>
  <text x="614" y="260" font-size="11.5" fill="#475569">VLANs, subnets, zones</text>
  <rect x="796" y="52" width="184" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="888.0" y="77" text-anchor="middle" font-weight="bold" fill="#475569">Process / ops</text>
  <rect x="796" y="108" width="184" height="46" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="808" y="127" font-weight="bold" fill="#0f172a">Gantt / dependency</text>
  <text x="808" y="144" font-size="11.5" fill="#475569">scheduling</text>
  <rect x="796" y="166" width="184" height="46" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="808" y="185" font-weight="bold" fill="#0f172a">Swimlane</text>
  <text x="808" y="202" font-size="11.5" fill="#475569">who owns each step</text>
  <rect x="796" y="224" width="184" height="46" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="808" y="243" font-weight="bold" fill="#0f172a">Timing</text>
  <text x="808" y="260" font-size="11.5" fill="#475569">signal timing, hardware</text>
  <line x1="20" y1="402" x2="980" y2="402" stroke="#e2e8f0"/>
  <rect x="20" y="420" width="34" height="22" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="64" y="436" fill="#0f172a">The short list: sequence, ER, C4 container cover ~90% of questions</text>
  <rect x="560" y="420" width="34" height="22" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="604" y="436" fill="#64748b">Usually skip: mostly ceremony or redundant</text>
</svg>
