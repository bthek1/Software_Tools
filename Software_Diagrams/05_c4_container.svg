  <text x="135.0" y="534.0" text-anchor="middle" font-size="11.5" fill="#ffffff">Validates, deduplicates,</text>
  <text x="135.0" y="549.0" text-anchor="middle" font-size="11.5" fill="#ffffff">batch writes</text>
  <rect x="330" y="470" width="200" height="100" rx="8" fill="#438dd5" stroke="#2e6295"/>
  <text x="430.0" y="502.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Query API</text>
  <text x="430.0" y="519.0" text-anchor="middle" font-size="11" fill="#e2e8f0">[Python, FastAPI, gunicorn]</text>
  <text x="430.0" y="534.0" text-anchor="middle" font-size="11.5" fill="#ffffff">Reads, authorisation,</text>
  <text x="430.0" y="549.0" text-anchor="middle" font-size="11.5" fill="#ffffff">payment orchestration</text>
