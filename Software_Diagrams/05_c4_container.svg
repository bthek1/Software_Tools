  <text x="590" y="746" text-anchor="middle" font-size="11" fill="#475569">[SQL]</text>
  <path d="M530,520 L892,520 L892,186" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="720" y="500" text-anchor="middle" font-size="11" fill="#475569">Charges card</text>
  <text x="720" y="513" text-anchor="middle" font-size="11" fill="#475569">[HTTPS]</text>
