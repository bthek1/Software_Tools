  <text x="135.0" y="750.0" text-anchor="middle" font-size="11" fill="#e2e8f0">[Redis]</text>
  <text x="135.0" y="765.0" text-anchor="middle" font-size="11.5" fill="#ffffff">24 hour dedupe keys,</text>
  <text x="135.0" y="780.0" text-anchor="middle" font-size="11.5" fill="#ffffff">rate limits</text>
  <path d="M330,693 L330,792 A100.0,13 0 0 0 530,792 L530,693 Z" fill="#438dd5" stroke="#2e6295"/>
  <ellipse cx="430.0" cy="693" rx="100.0" ry="13" fill="#438dd5" stroke="#2e6295"/>
