  <text x="430.0" y="329.0" text-anchor="middle" font-size="11" fill="#e2e8f0">[React, served by nginx]</text>
  <text x="430.0" y="344.0" text-anchor="middle" font-size="11.5" fill="#ffffff">Usage charts, invoice list,</text>
  <text x="430.0" y="359.0" text-anchor="middle" font-size="11.5" fill="#ffffff">payment</text>
