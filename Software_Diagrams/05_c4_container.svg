  <rect x="435" y="410" width="111" height="29" fill="#ffffff"/>
  <text x="438" y="422" text-anchor="start" font-size="11" fill="#475569">Calls</text>
  <text x="438" y="435" text-anchor="start" font-size="11" fill="#475569">[JSON over HTTPS]</text>
  <path d="M135,380 L135,470" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="140" y="410" width="105" height="29" fill="#ffffff"/>
  <text x="143" y="422" text-anchor="start" font-size="11" fill="#475569">Delivers batches</text>
  <text x="143" y="435" text-anchor="start" font-size="11" fill="#475569">[MQTT, LAN only]</text>
