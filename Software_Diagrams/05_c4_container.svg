  <text x="100" y="852" text-anchor="start" font-size="11" fill="#475569">[Software System]</text>
  <rect x="35" y="86" width="200" height="100" rx="8" fill="#999999" stroke="#6b6b6b"/>
  <text x="135.0" y="125.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Smart meters</text>
  <text x="135.0" y="142.5" text-anchor="middle" font-size="11" fill="#e2e8f0">[Software System]</text>
  <text x="135.0" y="157.5" text-anchor="middle" font-size="11.5" fill="#ffffff">ESP32 firmware</text>
  <rect x="335.0" y="86" width="190" height="100" rx="30" fill="#08427b" stroke="#052e56"/>
  <circle cx="430" cy="66" r="25" fill="#08427b" stroke="#052e56"/>
  <text x="430" y="129.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Customer</text>
  <text x="430" y="146.5" text-anchor="middle" font-size="11" fill="#e2e8f0">[Person]</text>
  <text x="430" y="161.5" text-anchor="middle" font-size="11.5" fill="#ffffff">Views usage, pays bills</text>
  <rect x="560.0" y="86" width="190" height="100" rx="30" fill="#08427b" stroke="#052e56"/>
  <circle cx="655" cy="66" r="25" fill="#08427b" stroke="#052e56"/>
  <text x="655" y="129.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Billing operator</text>
  <text x="655" y="146.5" text-anchor="middle" font-size="11" fill="#e2e8f0">[Person]</text>
  <text x="655" y="161.5" text-anchor="middle" font-size="11.5" fill="#ffffff">Runs and corrects billing</text>
  <rect x="800" y="86" width="185" height="100" rx="8" fill="#999999" stroke="#6b6b6b"/>
