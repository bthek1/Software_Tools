  <text x="438" y="267" text-anchor="start" font-size="11" fill="#475569">[HTTPS]</text>
  <path d="M640,186 L520,280" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="597" y="242" width="49" height="29" fill="#ffffff"/>
  <text x="600" y="254" text-anchor="start" font-size="11" fill="#475569">Uses</text>
  <text x="600" y="267" text-anchor="start" font-size="11" fill="#475569">[HTTPS]</text>
