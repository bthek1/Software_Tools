  <text x="285" y="665" text-anchor="middle" font-size="11" fill="#475569">[COPY, write role]</text>
  <path d="M430,570 L430,680" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="435" y="600" width="105" height="29" fill="#ffffff"/>
  <text x="438" y="612" text-anchor="start" font-size="11" fill="#475569">Queries</text>
  <text x="438" y="625" text-anchor="start" font-size="11" fill="#475569">[SQL, read role]</text>
  <path d="M650,760 L530,760" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="590" y="720" text-anchor="middle" font-size="11" fill="#475569">Reads and</text>
