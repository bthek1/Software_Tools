  <text x="97.5" y="226" text-anchor="middle" fill="#0f172a" font-weight="bold">meter_accuracy</text>
  <text x="22" y="254" font-size="11" fill="#0f172a">id: REQ-1</text>
  <text x="22" y="272" font-size="11" fill="#475569">Billing shall use</text>
  <text x="22" y="286" font-size="11" fill="#475569">readings accurate to</text>
