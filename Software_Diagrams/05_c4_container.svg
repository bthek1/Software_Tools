  <text x="143" y="625" text-anchor="start" font-size="11" fill="#475569">[RESP]</text>
  <path d="M235,540 L285,540 L285,745 L330,745" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="227" y="640" width="117" height="29" fill="#ffffff"/>
