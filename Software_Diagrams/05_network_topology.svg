<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <rect x="420" y="16" width="160" height="42" rx="21" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="500.0" y="41.5" text-anchor="middle" font-size="13" font-weight="bold">Internet</text>
  <rect x="330" y="110" width="340" height="60" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="500.0" y="137.0" text-anchor="middle" font-size="13" font-weight="bold">Edge firewall / router</text>
  <text x="500.0" y="154.0" text-anchor="middle" font-size="11.5">NAT, WireGuard endpoint :51820</text>
  <path d="M500,58 L500,110" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="508" y="88" text-anchor="start" font-size="11" fill="#475569">WAN</text>
  <rect x="20" y="230" width="280" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="247" text-anchor="start" font-size="12" font-weight="bold" fill="#475569">VLAN 30, IoT, 192.168.30.0/24</text>
  <rect x="40" y="268" width="240" height="76" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="160.0" y="295.5" text-anchor="middle" font-size="13" font-weight="bold">Meter gateways</text>
  <text x="160.0" y="312.5" text-anchor="middle" font-size="11.5">egress 8883/tcp only,</text>
  <text x="160.0" y="327.5" text-anchor="middle" font-size="11.5">no lateral traffic</text>
  <rect x="340" y="230" width="320" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="352" y="247" text-anchor="start" font-size="12" font-weight="bold" fill="#475569">VLAN 10, DMZ, 192.168.10.0/24</text>
  <rect x="370" y="268" width="260" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="500.0" y="303.0" text-anchor="middle" font-size="13" font-weight="bold">reverse-proxy 192.168.10.10</text>
  <text x="500.0" y="320.0" text-anchor="middle" font-size="11.5">in: 443/tcp, 8883/tcp</text>
  <rect x="700" y="230" width="260" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="712" y="247" text-anchor="start" font-size="12" font-weight="bold" fill="#475569">VLAN 99, admin, 192.168.99.0/24</text>
  <rect x="720" y="268" width="220" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="830.0" y="303.0" text-anchor="middle" font-size="13" font-weight="bold">Admin workstation</text>
  <text x="830.0" y="320.0" text-anchor="middle" font-size="11.5">via WireGuard</text>
  <rect x="20" y="440" width="940" height="190" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="457" text-anchor="start" font-size="12" font-weight="bold" fill="#475569">VLAN 20, servers, 192.168.2.0/24</text>
  <rect x="30" y="500" width="260" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="160.0" y="534.5" text-anchor="middle" font-size="13" font-weight="bold">data CT 192.168.2.206</text>
  <text x="160.0" y="551.5" text-anchor="middle" font-size="11.5">in: 5432/tcp, 6379/tcp</text>
  <text x="160.0" y="566.5" text-anchor="middle" font-size="11.5">from 192.168.2.205 only</text>
  <rect x="370" y="500" width="260" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="500.0" y="534.5" text-anchor="middle" font-size="13" font-weight="bold">meterhub CT 192.168.2.205</text>
  <text x="500.0" y="551.5" text-anchor="middle" font-size="11.5">in: 8000/tcp, 9001/tcp</text>
  <text x="500.0" y="566.5" text-anchor="middle" font-size="11.5">from VLAN 10</text>
  <rect x="690" y="500" width="250" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="815.0" y="534.5" text-anchor="middle" font-size="13" font-weight="bold">Proxmox host 192.168.2.70</text>
  <text x="815.0" y="551.5" text-anchor="middle" font-size="11.5">mgmt 8006/tcp,</text>
  <text x="815.0" y="566.5" text-anchor="middle" font-size="11.5">admin VLAN only</text>
  <path d="M500,170 L500,268" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="505" y="193" width="92" height="16" fill="#ffffff"/>
  <text x="508" y="205" text-anchor="start" font-size="11" fill="#475569">443, 8883 dnat</text>
  <path d="M160,268 L160,140 L330,140" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="245" y="132" text-anchor="middle" font-size="11" fill="#b91c1c">8883/tcp egress</text>
  <path d="M470,344 L470,500" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="410" y="400" width="55" height="16" fill="#ffffff"/>
  <text x="462" y="412" text-anchor="end" font-size="11" fill="#475569">8000/tcp</text>
  <path d="M530,344 L530,500" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="535" y="400" width="55" height="16" fill="#ffffff"/>
  <text x="538" y="412" text-anchor="start" font-size="11" fill="#475569">1883/tcp</text>
  <path d="M370,545 L290,545" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="537" text-anchor="middle" font-size="11" fill="#475569">5432, 6379</text>
  <path d="M880,344 L880,500" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="770" y="400" width="105" height="16" fill="#ffffff"/>
  <text x="872" y="412" text-anchor="end" font-size="11" fill="#047857">22/tcp, 8006/tcp</text>
  <path d="M760,344 L760,472 L600,472 L600,500" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="659" y="454" width="43" height="16" fill="#ffffff"/>
  <text x="680" y="466" text-anchor="middle" font-size="11" fill="#047857">22/tcp</text>
  <path d="M670,150 L985,150 L985,545 L960,545" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="828" y="128" text-anchor="middle" font-size="11">default deny</text>
  <text x="828" y="141" text-anchor="middle" font-size="11">between all VLANs</text>
  <text x="20" y="652" text-anchor="start" font-size="11" fill="#475569">Red: untrusted. Green: management. Dashed: default deny between all VLANs.</text>
</svg>
