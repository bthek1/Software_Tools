  <text x="430.0" y="750.0" text-anchor="middle" font-size="11" fill="#e2e8f0">[TimescaleDB]</text>
  <text x="430.0" y="765.0" text-anchor="middle" font-size="11.5" fill="#ffffff">Readings hypertable,</text>
  <text x="430.0" y="780.0" text-anchor="middle" font-size="11.5" fill="#ffffff">invoices, customers</text>
  <rect x="650" y="690" width="190" height="105" rx="8" fill="#438dd5" stroke="#2e6295"/>
  <text x="745.0" y="724.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Billing service</text>
  <text x="745.0" y="741.5" text-anchor="middle" font-size="11" fill="#e2e8f0">[Python, systemd timer]</text>
  <text x="745.0" y="756.5" text-anchor="middle" font-size="11.5" fill="#ffffff">Nightly pricing and</text>
  <text x="745.0" y="771.5" text-anchor="middle" font-size="11.5" fill="#ffffff">invoice issue</text>
